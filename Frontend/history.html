<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Match History</h1>
        <table>
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Winner</th>
                    <th>Moves</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="historyTable">
                <!-- Matches will appear here -->
            </tbody>
        </table>
        <button id="backBtn">
            Back to Home
        </button>
    </main>
    <script src="history.js"></script>
</body>
</html>
